# Production-style stack for a single VPS behind Nginx.
#   docker compose up -d --build
# App listens on 127.0.0.1:3001 only; Nginx terminates TLS and proxies to it.
name: nexora

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nexora
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@db:5432/nexora
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@db:5432/nexora
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:

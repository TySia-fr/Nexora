name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora
      SHADOW_DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora_shadow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Print SQL the schema expects (from empty)
        run: pnpm exec prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script

# Generates a Prisma migration from the current schema and pushes it to the
# `migration-draft` branch for review. Useful when the schema is edited from an
# environment that cannot run the Prisma migration engine.
# Locally, prefer: pnpm db:migrate --name <name>
name: Migration draft

on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name (snake_case)
        required: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration name
        env:
          NAME: ${{ inputs.name }}
        run: '[[ "$NAME" =~ ^[a-z0-9_]{1,60}$ ]] || { echo "invalid name"; exit 1; }'
      - name: Create migration
        env:
          NAME: ${{ inputs.name }}
        run: pnpm exec prisma migrate dev --create-only --name "$NAME"
      - name: Push to migration-draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B migration-draft
          git add prisma/migrations
          git commit -m "draft migration: ${{ inputs.name }}"
          git push --force origin migration-draft

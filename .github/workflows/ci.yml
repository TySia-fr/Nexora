name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora
      TEST_DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy
      - name: Check schema and migrations agree
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Prepare test database
        run: |
          PGPASSWORD=nexora_ci psql -h localhost -U nexora -d nexora -c "CREATE DATABASE nexora_test"
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate deploy
      - name: Seed runs cleanly
        run: pnpm db:seed
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora_ci
          POSTGRES_DB: nexora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:nexora_ci@localhost:5432/nexora
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:3000
      # Many sign-ups come from one IP during the suite. Test-only setting.
      RATE_LIMIT_MULTIPLIER: "100"
      E2E_ADMIN_EMAIL: admin@nexora.test
      E2E_ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - name: Create admin
        run: ADMIN_EMAIL="$E2E_ADMIN_EMAIL" ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" pnpm admin:create
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image (no database available, by design)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: nexora:ci
      - name: Image starts and serves the health endpoint shape
        run: |
          docker run -d --name nexora -p 3000:3000 \
            -e DATABASE_URL=postgresql://none:none@127.0.0.1:1/none \
            -e BETTER_AUTH_SECRET=ci-only-secret-ci-only-secret-ci-only-secret \
            -e APP_URL=http://localhost:3000 nexora:ci
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true); [ "$code" = "503" ] && break; sleep 1; done
          echo "health without database: $code (expected 503)"
          test "$code" = "503"
          docker exec nexora id -u | grep -qv '^0$' && echo "runs as non-root"
